{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Inscription Recruteur{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h3 mb-4">Inscription — Recruteur</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% crispy form %}
        </form>
        <p class="mt-3">
            <a href="{% url 'accounts:signup_choice' %}">← Retour au choix du profil</a>
        </p>
    </div>
</div>
{% endblock %}
