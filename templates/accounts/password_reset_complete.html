{% extends "base.html" %}
{% load crispy_forms_tags i18n %}

{% block title %}{% translate "Mot de passe modifié" %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body">
        <div class="text-center"><span class="auth-icon"><i class="bi bi-check2-circle"></i></span>
        <h1 class="h3 mb-4">{% translate "Mot de passe modifié" %}</h1></div>
        <p>{% translate "Votre mot de passe a été réinitialisé." %}</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">{% translate "Se connecter" %}</a>
        </div>
    </div>
</div>
{% endblock %}
