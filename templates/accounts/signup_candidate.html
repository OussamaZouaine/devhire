{% extends "base.html" %}
{% load crispy_forms_tags i18n %}

{% block title %}{% translate "Inscription Candidat" %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body">
        <div class="text-center"><span class="auth-icon"><i class="bi bi-person-workspace"></i></span>
        <h1 class="h3 mb-4">{% translate "Inscription — Candidat" %}</h1></div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% crispy form %}
        </form>
        <p class="mt-3">
            <a href="{% url 'accounts:signup_choice' %}">← {% translate "Retour au choix du profil" %}</a>
        </p>
        </div>
    </div>
</div>
{% endblock %}
