{% extends "base.html" %}
{% load crispy_forms_tags i18n %}

{% block title %}{% translate "Changer de mot de passe" %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body">
        <div class="text-center"><span class="auth-icon"><i class="bi bi-shield-lock"></i></span>
        <h1 class="h3 mb-4">{% translate "Changer de mot de passe" %}</h1></div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">{% translate "Modifier le mot de passe" %}</button>
        </form>
        </div>
    </div>
</div>
{% endblock %}
