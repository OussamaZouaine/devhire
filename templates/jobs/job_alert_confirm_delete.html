{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Supprimer l'alerte" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="h4 mb-3">{% translate "Supprimer l'alerte" %} « {{ object.name }} » ?</h1>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% translate "Supprimer" %}</button>
            <a href="{% url 'jobs:job_alert_list' %}" class="btn btn-outline-secondary">{% translate "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
