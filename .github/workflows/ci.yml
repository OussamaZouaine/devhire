name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devhire
          POSTGRES_USER: devhire
          POSTGRES_PASSWORD: devhire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DATABASE_URL: postgres://devhire:devhire@localhost:5432/devhire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py build_translations --check
      - run: coverage run manage.py test
      - run: coverage report
